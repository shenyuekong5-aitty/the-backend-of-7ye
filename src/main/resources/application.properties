# ==================== 通用配置 ====================
# 默认数据库配置（生产环境：postgres:5432）
# 本地开发通过 spring-boot-maven-plugin 自动激活 local profile 切换为 localhost:5332
spring.datasource.url=jdbc:postgresql://postgres:5432/7ye
spring.datasource.username=aitty
spring.datasource.password=aitty
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

spring.config.import=aliyun.properties, optional:classpath:secrets.local.properties

# ==================== 多部分文件上传 ====================
spring:
    servlet:
        multipart:
            enabled: true
            max-file-size: 10MB
            max-request-size: 10MB

# ==================== AI 助手配置 ====================
spring.ai.openai.api-key=${sensenova.api-key:${SENSENOVA_API_KEY:}}
spring.ai.openai.base-url=https://token.sensenova.cn/v1
spring.ai.openai.chat.options.model=sensenova-6.7-flash-lite
spring.ai.openai.chat.options.temperature=0.7
spring.ai.openai.chat.options.max-tokens=1500

ai.owner-user-id=1
ai.max-history-messages=10